name: Bug Report
about: Report a problem or unexpected behaviour
title: "[Bug]: "
labels:
  - Bug
body:
  - type: textarea
    id: details-of-issue
    attributes:
      label: Details of Issue
      description: Describe the issue in as much detail as possible.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment (Machine, `git` hashes, etc.)"
      description: Git commit or tag used, environment variables, software dependency versions, machine name, etc.
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected Outcome
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-outcome
    attributes:
      label: Actual Outcome
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: steps-taken-to-fix
    attributes:
      label: Steps Taken to Fix (if any)
      description: Any troubleshooting or fixes you've already tried.
    validations:
      required: false