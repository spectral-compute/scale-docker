on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'App-hub projects to build (JSON array, names match scale-validation/ subdirs)'
        type: 'string'
        default: |-
          [
            "caffe",
            "cycles",
            "hashcat",
            "nvflip",
            "whispercpp",
            "alien",
            "cusz",
            "fasteddy",
            "gpujpeg",
            "llama.cpp",
            "rabbitct"
          ]
      gfx:
        description: 'Override the GPUs to build/test on (JSON array). Defaults to vars.SCALE_GPUS_TO_DOCKER_TEST, falling back to vars.SCALE_GPUS_TO_TEST.'
        required: false
        # default: '${{ vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST }}'
        type: 'string'
      deploy:
        description: 'Push tested images to the public registries (quay.io/docker.io).'
        default: false
        type: 'boolean'
      scale_base_image:
        description: 'Override SCALE_BASE_IMAGE build-arg (e.g. a nightly base image tag). Empty means use each Dockerfile default.'
        default: ''
        type: 'string'
      scale_validation_ref:
        description: 'scale-validation ref/branch to build Dockerfiles from'
        default: 'release'
        type: 'string'

env:
  DOCKER_REGISTRY: "${{ vars.DOCKER_REGISTRY }}"
  PRODUCTION_DOCKER_REGISTRY: quay.io
  PRODUCTION_DOCKER_REGISTRY2: docker.io

jobs:
  build-images:
    name: 'build-${{ matrix.project }}-${{ matrix.gfx }}'
    runs-on: docker-builder
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
    container:
      image: ${{ vars.DOCKER_REGISTRY }}/spectral/docker-ubuntu24.04:latest
    steps:
      - name: Checkout and setup
        uses: ${{ forgejo.server_url }}/spectral-compute/ci-helpers/setup@master
        with:
          token: '${{ secrets.CI_CLONE_TOKEN }}'
          private-key: '${{ secrets.CI_BOT_USER_PRIVATE_KEY }}'
          netrc: '${{ secrets.CI_NETRC }}'

      - name: Clone scale-validation
        run: git clone -b "$SCALE_VALIDATION_REF" https://github.com/spectral-compute/scale-validation scale-validation
        env:
          SCALE_VALIDATION_REF: ${{ inputs.scale_validation_ref }}

      - name: Build and push images
        run: |
          set -e
          . scripts/apphub-tags.sh "$PROJECT" "$GFX" "$RUN_NUMBER"

          ARGS=(--build-arg GPU_ARCH="$GFX")
          if [ -n "$SCALE_BASE_IMAGE" ]; then
              ARGS+=(--build-arg SCALE_BASE_IMAGE="$SCALE_BASE_IMAGE")
          fi

          # -t twice: same build, so a failed build pushes neither tag.
          sudo -E docker build "${ARGS[@]}" --target test -t "$TEST_TAG" -t "$RUN_TEST_TAG" \
              -f "scale-validation/$PROJECT/Dockerfile" scale-validation/
          sudo -E docker push "$TEST_TAG"
          sudo -E docker push "$RUN_TEST_TAG"

          sudo -E docker build "${ARGS[@]}" -t "$INTERNAL_TAG" -t "$RUN_INTERNAL_TAG" \
              -f "scale-validation/$PROJECT/Dockerfile" scale-validation/
          sudo -E docker push "$INTERNAL_TAG"
          sudo -E docker push "$RUN_INTERNAL_TAG"
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          SCALE_BASE_IMAGE: ${{ inputs.scale_base_image }}
          RUN_NUMBER: ${{ forgejo.run_number }}

  test:
    # Prefixed run- (not test-) so geoff-v2's job_to_program_name/job_to_gfx_name
    # regexes (which only match ^(run|build)-...) can classify these jobs when
    # tracking this pipeline via GauntletStatus.
    name: 'run-${{ matrix.project }}-${{ matrix.gfx }}'
    runs-on: ${{ matrix.gfx }}
    needs: build-images
    # Run even if a build-images leg failed/was cancelled; each test instance still
    # fails on its own if its image wasn't pushed.
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
    # Runs as a container job (matching every other GPU-labeled runner job in this org's
    # CI - build-test-deploy.yml's own test job, package.yml's GPU job,
    # extended-tests.yml's run-thirdparty-test) so GPU passthrough is handled by the
    # runner/label itself, not hand-rolled --device flags (which would be AMD-only and
    # give NVIDIA sm_* matrix entries no GPU access at all).
    container:
      # Run-scoped tag: build-images only pushes it on a fresh success, so a failed
      # build fails this pull instead of resolving to a stale image.
      image: ${{ vars.DOCKER_REGISTRY }}/spectral-compute/${{ matrix.project }}:${{ matrix.gfx }}-test-run${{ forgejo.run_number }}
    steps:
      # A container job's own ENTRYPOINT isn't auto-invoked - Actions overrides it to
      # keep the container alive and runs steps via `docker exec`. GPU_ARCH is already
      # set as an image env var from the build; this runs the exact command the image's
      # ENTRYPOINT bakes in per project (see scale-validation/<project>/Dockerfile).
      - name: Run container test stage
        run: bash /build/test.sh /build /opt/scale "$GPU_ARCH" "$PROJECT" --match '-(test|benchmark)' --keep
        env:
          PROJECT: ${{ matrix.project }}

      # needs: test (below) can only see this whole matrixed job's aggregate result, not
      # which specific project/gfx leg passed - one leg failing would otherwise skip
      # *every* deploy leg, including ones whose own test passed. This step only runs if
      # the test step above succeeded (default step behaviour, no `if:` override needed),
      # and records that fact per-leg via a commit status deploy can check individually.
      - name: Record this leg's test result
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${FJ_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"success\",\"context\":\"apphub-test/${PROJECT}-${GFX}\",\"description\":\"container test stage passed\"}" \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/statuses/${{ forgejo.sha }}"
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          FJ_TOKEN: ${{ secrets.CI_CLONE_TOKEN }}

  deploy:
    name: 'deploy-${{ matrix.project }}-${{ matrix.gfx }}-${{ matrix.destination }}'
    runs-on: docker-builder
    needs: test
    # Run even if a test leg failed/was cancelled; "Verify this leg's test actually
    # passed" below is the real per-leg gate.
    if: ${{ inputs.deploy }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
        destination: ['quay', 'docker']
    container:
      image: ${{ vars.DOCKER_REGISTRY }}/spectral/docker-ubuntu24.04:latest
    steps:
      - name: Verify this leg's test actually passed
        # needs: test only guarantees the *whole* test job finished, not that this
        # specific project/gfx leg succeeded - check the commit status that leg recorded
        # itself, so a failure elsewhere in the matrix can't silently skip a good deploy,
        # and a failure in *this* leg can't slip through on the strength of others.
        #
        # UNVERIFIED (authored without live Forgejo API access - confirm before relying
        # on this for a real deploy):
        # - `.status` on the read side, vs `.state` used in the write side's POST body,
        #   may be intentional (Gitea/Forgejo's CommitStatus read struct is believed to
        #   serialize this field as `status` even though CreateStatusOption's write
        #   field is `state`) rather than a mismatch - but this wasn't confirmed against
        #   a live instance. If wrong, this fails closed (STATUS reads empty, deploy is
        #   blocked) rather than letting anything untested through.
        # - CI_CLONE_TOKEN's scope for the commit-status API (read+write) is unconfirmed
        #   - it's only proven elsewhere in this file for git clone auth. If a built-in
        #   per-run token is available on this Forgejo instance (e.g. secrets.GITHUB_TOKEN),
        #   that would be a more idiomatic, likely-correctly-scoped choice - no workflow
        #   in this repo currently uses one, so availability is unverified either way.
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          CONTEXT="apphub-test/${PROJECT}-${GFX}"
          STATUS="$(curl -sf -H "Authorization: token ${FJ_TOKEN}" \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/commits/${{ forgejo.sha }}/status" \
            | jq -r --arg ctx "$CONTEXT" '.statuses[]? | select(.context == $ctx) | .status' | head -1)"
          echo "test status for ${PROJECT}/${GFX}: ${STATUS:-missing}"
          if [ "${STATUS}" != "success" ]; then
            echo "::error::${PROJECT}/${GFX}'s own test leg did not pass (status=${STATUS:-missing}) - refusing to deploy this image, even though other legs in this run may have succeeded."
            exit 1
          fi
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          FJ_TOKEN: ${{ secrets.CI_CLONE_TOKEN }}

      - name: Checkout and setup
        uses: ${{ forgejo.server_url }}/spectral-compute/ci-helpers/setup@master
        with:
          token: '${{ secrets.CI_CLONE_TOKEN }}'
          private-key: '${{ secrets.CI_BOT_USER_PRIVATE_KEY }}'
          netrc: '${{ secrets.CI_NETRC }}'

      - name: Clone scale-validation
        run: git clone -b "$SCALE_VALIDATION_REF" https://github.com/spectral-compute/scale-validation scale-validation
        env:
          SCALE_VALIDATION_REF: ${{ inputs.scale_validation_ref }}

      - name: Log in to production registry
        run: |
          case "$DESTINATION" in
            quay)
              echo '${{ secrets.PRODUCTION_REGISTRY_PASSWORD }}' | sudo -E docker login quay.io -u '${{ secrets.PRODUCTION_REGISTRY_USERNAME }}' --password-stdin
              ;;
            docker)
              echo '${{ secrets.PRODUCTION_REGISTRY2_PASSWORD }}' | sudo -E docker login docker.io -u '${{ secrets.PRODUCTION_REGISTRY2_USERNAME }}' --password-stdin
              ;;
          esac
        env:
          DESTINATION: ${{ matrix.destination }}

      - name: Retag and push to production registry
        run: |
          set -e
          . scripts/apphub-tags.sh "$PROJECT" "$GFX" "$RUN_NUMBER" "$DESTINATION"
          # Run-scoped tag: needs: test can't catch a vacuous test pass, but this pull
          # fails outright if this run's build never pushed it.
          sudo -E docker pull "$RUN_INTERNAL_TAG"
          for TAG in $PUBLIC_TAGS; do
              sudo -E docker tag "$RUN_INTERNAL_TAG" "$TAG"
              sudo -E docker push "$TAG"
          done
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          DESTINATION: ${{ matrix.destination }}
          RUN_NUMBER: ${{ forgejo.run_number }}
