on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'App-hub projects to build (JSON array, names match scale-validation/ subdirs)'
        type: 'string'
        default: |-
          [
            "caffe",
            "cycles",
            "hashcat",
            "nvflip",
            "whispercpp",
            "alien",
            "cusz",
            "fasteddy",
            "gpujpeg",
            "llama.cpp",
            "rabbitct"
          ]
      gfx:
        description: 'Override the GPUs to build/test on (JSON array). Defaults to vars.SCALE_GPUS_TO_DOCKER_TEST, falling back to vars.SCALE_GPUS_TO_TEST.'
        required: false
        # default: '${{ vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST }}'
        type: 'string'
      deploy:
        description: 'Push tested images to the public registries (quay.io/docker.io).'
        default: false
        type: 'boolean'
      scale_base_image:
        description: 'Override SCALE_BASE_IMAGE build-arg (e.g. a nightly base image tag). Empty means use each Dockerfile default.'
        default: ''
        type: 'string'
      scale_validation_ref:
        description: 'scale-validation ref/branch to build Dockerfiles from'
        default: 'release'
        type: 'string'

env:
  DOCKER_REGISTRY: "${{ vars.DOCKER_REGISTRY }}"
  PRODUCTION_DOCKER_REGISTRY: quay.io
  PRODUCTION_DOCKER_REGISTRY2: docker.io

jobs:
  build-images:
    name: 'build-${{ matrix.project }}-${{ matrix.gfx }}'
    runs-on: docker-builder
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
    container:
      image: ${{ vars.DOCKER_REGISTRY }}/spectral/docker-ubuntu24.04:latest
    steps:
      - name: Checkout and setup
        uses: ${{ forgejo.server_url }}/spectral-compute/ci-helpers/setup@master
        with:
          token: '${{ secrets.CI_CLONE_TOKEN }}'
          private-key: '${{ secrets.CI_BOT_USER_PRIVATE_KEY }}'
          netrc: '${{ secrets.CI_NETRC }}'

      - name: Clone scale-validation
        run: git clone -b "$SCALE_VALIDATION_REF" https://github.com/spectral-compute/scale-validation scale-validation
        env:
          SCALE_VALIDATION_REF: ${{ inputs.scale_validation_ref }}

      - name: Build and push images
        run: |
          set -e
          . scripts/apphub-tags.sh "$PROJECT" "$GFX" "$RUN_NUMBER"

          ARGS=(--build-arg GPU_ARCH="$GFX")
          if [ -n "$SCALE_BASE_IMAGE" ]; then
              ARGS+=(--build-arg SCALE_BASE_IMAGE="$SCALE_BASE_IMAGE")
          fi

          # -t twice: same build, so a failed build pushes neither tag.
          sudo -E docker build "${ARGS[@]}" --target test -t "$TEST_TAG" -t "$RUN_TEST_TAG" \
              -f "scale-validation/$PROJECT/Dockerfile" scale-validation/
          sudo -E docker push "$TEST_TAG"
          sudo -E docker push "$RUN_TEST_TAG"

          sudo -E docker build "${ARGS[@]}" -t "$INTERNAL_TAG" -t "$RUN_INTERNAL_TAG" \
              -f "scale-validation/$PROJECT/Dockerfile" scale-validation/
          sudo -E docker push "$INTERNAL_TAG"
          sudo -E docker push "$RUN_INTERNAL_TAG"
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          SCALE_BASE_IMAGE: ${{ inputs.scale_base_image }}
          RUN_NUMBER: ${{ forgejo.run_number }}

  test:
    # Prefixed run- (not test-) so geoff-v2's job_to_program_name/job_to_gfx_name
    # regexes (which only match ^(run|build)-...) can classify these jobs when
    # tracking this pipeline via GauntletStatus.
    name: 'run-${{ matrix.project }}-${{ matrix.gfx }}'
    runs-on: ${{ matrix.gfx }}
    needs: build-images
    # Don't let one build-images leg block every test leg; each test leg still fails
    # on its own if its image wasn't pushed (container pull fails).
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
    # Container job (like every other GPU-labeled runner job in this org) so GPU
    # passthrough comes from the runner label, not hand-rolled --device flags.
    container:
      # Run-scoped tag: build-images only pushes it on a fresh success, so a failed
      # build fails this pull instead of resolving to a stale image.
      image: ${{ vars.DOCKER_REGISTRY }}/spectral-compute/${{ matrix.project }}:${{ matrix.gfx }}-test-run${{ forgejo.run_number }}
    steps:
      # Actions overrides the container's ENTRYPOINT to keep it alive; this runs the
      # same command the image's own ENTRYPOINT bakes in per project.
      - name: Run container test stage
        run: bash /build/test.sh /build /opt/scale "$GPU_ARCH" "$PROJECT" --match '-(test|benchmark)' --keep
        env:
          PROJECT: ${{ matrix.project }}

  deploy:
    name: 'deploy-${{ matrix.project }}-${{ matrix.gfx }}-${{ matrix.destination }}'
    runs-on: docker-builder
    needs: test
    # A custom if: bypasses the default implicit success() gate, so this runs
    # regardless of test's outcome; "Verify this leg's test actually passed" below is
    # the real per-leg gate. Nightlies always pass deploy=false.
    if: ${{ inputs.deploy }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        gfx: ${{ fromJSON(inputs.gfx || vars.SCALE_GPUS_TO_DOCKER_TEST || vars.SCALE_GPUS_TO_TEST) }}
        destination: ['quay', 'docker']
    container:
      image: ${{ vars.DOCKER_REGISTRY }}/spectral/docker-ubuntu24.04:latest
    steps:
      - name: Verify this leg's test actually passed
        # needs: test only guarantees the whole test job finished, not this leg -
        # query this run's own jobs for this leg's actual status.
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          JOB_NAME="run-${PROJECT}-${GFX}"
          STATUS="$(curl -sf -H "Authorization: token ${FJ_TOKEN}" \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_id }}/jobs" \
            | jq -r --arg n "$JOB_NAME" '.[] | select(.name == $n) | .status')"
          echo "test status for ${PROJECT}/${GFX}: ${STATUS:-missing}"
          if [ "${STATUS}" != "success" ]; then
            echo "::error::${PROJECT}/${GFX}'s own test leg did not pass (status=${STATUS:-missing}) - refusing to deploy this image, even though other legs in this run may have succeeded."
            exit 1
          fi
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          FJ_TOKEN: ${{ secrets.CI_CLONE_TOKEN }}

      - name: Checkout and setup
        uses: ${{ forgejo.server_url }}/spectral-compute/ci-helpers/setup@master
        with:
          token: '${{ secrets.CI_CLONE_TOKEN }}'
          private-key: '${{ secrets.CI_BOT_USER_PRIVATE_KEY }}'
          netrc: '${{ secrets.CI_NETRC }}'

      - name: Clone scale-validation
        run: git clone -b "$SCALE_VALIDATION_REF" https://github.com/spectral-compute/scale-validation scale-validation
        env:
          SCALE_VALIDATION_REF: ${{ inputs.scale_validation_ref }}

      - name: Log in to production registry
        run: |
          case "$DESTINATION" in
            quay)
              echo '${{ secrets.PRODUCTION_REGISTRY_PASSWORD }}' | sudo -E docker login quay.io -u '${{ secrets.PRODUCTION_REGISTRY_USERNAME }}' --password-stdin
              ;;
            docker)
              echo '${{ secrets.PRODUCTION_REGISTRY2_PASSWORD }}' | sudo -E docker login docker.io -u '${{ secrets.PRODUCTION_REGISTRY2_USERNAME }}' --password-stdin
              ;;
          esac
        env:
          DESTINATION: ${{ matrix.destination }}

      - name: Retag and push to production registry
        run: |
          set -e
          . scripts/apphub-tags.sh "$PROJECT" "$GFX" "$RUN_NUMBER" "$DESTINATION"
          # Run-scoped tag: pull fails outright if this run's build never pushed it.
          sudo -E docker pull "$RUN_INTERNAL_TAG"
          for TAG in $PUBLIC_TAGS; do
              sudo -E docker tag "$RUN_INTERNAL_TAG" "$TAG"
              sudo -E docker push "$TAG"
          done
        env:
          PROJECT: ${{ matrix.project }}
          GFX: ${{ matrix.gfx }}
          DESTINATION: ${{ matrix.destination }}
          RUN_NUMBER: ${{ forgejo.run_number }}
